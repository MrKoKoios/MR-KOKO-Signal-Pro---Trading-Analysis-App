name: Build MR KOKO APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      # Create Android launcher icon from the existing MR KOKO logo
      - name: Create Android App Icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable

          if [ ! -f "assets/logo.jpg" ]; then
            echo "ERROR: assets/logo.jpg not found"
            exit 1
          fi

          cp assets/logo.jpg android/app/src/main/res/drawable/app_logo.jpg

          echo "Android app icon created:"
          ls -lh android/app/src/main/res/drawable/app_logo.jpg

      # Fix flutter_overlay_window Manifest
      - name: Fix Overlay Window Manifest
        shell: bash
        run: |
          PLUGIN_MANIFEST=$(find "$HOME/.pub-cache" \
            -path "*/flutter_overlay_window-*/android/src/main/AndroidManifest.xml" \
            -print -quit)

          if [ -z "$PLUGIN_MANIFEST" ]; then
            echo "ERROR: flutter_overlay_window Manifest not found"
            exit 1
          fi

          echo "Found: $PLUGIN_MANIFEST"

          sed -i 's/package="com.example.flutter_overlay_window"//g' "$PLUGIN_MANIFEST"

          echo "Updated Manifest:"
          cat "$PLUGIN_MANIFEST"

      - name: Build Release APK
        run: flutter build apk --release --no-obfuscate

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-KOKO-SignalPro
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
